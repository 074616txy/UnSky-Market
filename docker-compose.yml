services:
  mysql:
    image: mysql:8.0
    container_name: unsky-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: unsky_market
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - unsky-mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: unsky-redis
    ports:
      - "6379:6379"
    volumes:
      - unsky-redis-data:/data

  backend:
    build:
      context: .
      dockerfile: Unsky-backend/Dockerfile
    container_name: unsky-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/unsky_market?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8081:8081"

  frontend:
    image: nginx:latest
    container_name: unsky-frontend
    depends_on:
      - backend
    ports:
      - "8082:80"
    volumes:
      - ../UnSky-Market/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  unsky-mysql-data:
  unsky-redis-data:
